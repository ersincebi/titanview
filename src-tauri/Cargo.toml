[package]
name = "titanview-desktop"
version = "1.0.1"
license = "AGPL-3.0-or-later"
description = "TitanView shell (Tauri v2): desktop with Go sidecar, Android with in-process Go core"
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "titanview_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"
log = "0.4"

# Yalnız masaüstü (Faz 31): tepsi, genel kısayol, güncelleyici, tek örnek.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
